[build]
  command = "cd backend && npx prisma generate && cd .. && npm run build -w @fin-health/frontend"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "20"

# Serve index.html for all routes so React Router handles navigation
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Long-lived cache for hashed assets (Vite fingerprints filenames)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
