[build]
  builder       = "DOCKERFILE"
  dockerfilePath = "backend/Dockerfile"

[deploy]
  # Run migrations before each deployment goes live
  releaseCommand   = "node_modules/.bin/prisma migrate deploy --schema=./backend/prisma/schema.prisma"
  healthcheckPath  = "/api/health"
  healthcheckTimeout = 300
  restartPolicyType      = "ON_FAILURE"
  restartPolicyMaxRetries = 10
